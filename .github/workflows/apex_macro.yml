name: Apex Macro Desk Intelligence

on:
  schedule:
    # 🇬🇧 London Session Open (~06:30 GMT+1) -> 05:24 UTC (Off-peak minute 24)
    - cron: '24 5 * * 1-5'
    
    # 🇺🇸 New York Session Open (~12:30 GMT+1) -> 11:24 UTC (Off-peak minute 24)
    - cron: '24 11 * * 1-5'
    
    # 🌆 End of Day (EOD) Summary (~21:00 GMT+1) -> 19:54 UTC (Off-peak minute 54)
    - cron: '54 19 * * 1-5'

    # ⚡ Automated Post-News Intraday Scanner (Hourly off-peak at minute 17)
    - cron: '17 7-18 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Session Mode to Run'
        required: true
        default: 'auto_check'
        type: choice
        options:
          - auto_check
          - update
          - london
          - ny
          - eod
          - all

jobs:
  run-macro-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib google-genai requests

      - name: Determine & Run Macro Engine (Scheduled)
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          echo "⏰ Cron Trigger Matched: $TRIGGER_CRON"
          
          case "$TRIGGER_CRON" in
            "24 5 * * 1-5")
              echo "🚀 Executing London Session Report..."
              python main.py --mode london
              ;;
            "24 11 * * 1-5")
              echo "🚀 Executing New York Session Report..."
              python main.py --mode ny
              ;;
            "54 19 * * 1-5")
              echo "🚀 Executing End of Day (EOD) Wrap..."
              python main.py --mode eod
              ;;
            *)
              echo "⚡ Running Hourly Volatility & Post-News Check..."
              python main.py --mode auto_check
              ;;
          esac

      - name: Run Apex Macro Engine (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode ${{ github.event.inputs.mode }}
