name: Apex Macro Desk Intelligence

on:
  schedule:
    # 🇬🇧 London Session Open: 06:30 UTC
    - cron: '30 6 * * 1-5'
    
    # 🇺🇸 New York Session Open: 12:30 UTC
    - cron: '30 12 * * 1-5'
    
    # 🌆 End of Day (EOD) Summary: 21:00 UTC
    - cron: '0 21 * * 1-5'

    # ⚡ Automated Post-News Intraday Scanner: Hourly between 08:00 and 20:00 UTC
    - cron: '0 8-20 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Session Mode to Run'
        required: true
        default: 'auto_check'
        type: choice
        options:
          - auto_check
          - update
          - london
          - ny
          - eod
          - all

jobs:
  run-macro-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib google-genai requests

      - name: Run Apex Macro Engine (Scheduled)
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          
          # Exact scheduled session opens
          if [ "$HOUR" -eq "06" ] && [ "$MINUTE" -ge "25" ] && [ "$MINUTE" -le "35" ]; then
            python main.py --mode london
          elif [ "$HOUR" -eq "12" ] && [ "$MINUTE" -ge "25" ] && [ "$MINUTE" -le "35" ]; then
            python main.py --mode ny
          elif [ "$HOUR" -eq "21" ] && [ "$MINUTE" -le "10" ]; then
            python main.py --mode eod
          else
            # Hourly intraday volatility & post-news check
            python main.py --mode auto_check
          fi

      - name: Run Apex Macro Engine (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py --mode ${{ github.event.inputs.mode }}
