name: Apex Macro Desk Intelligence

on:
  # Automated Cron Schedules (UTC Time)
  schedule:
    # 🇬🇧 London Session Open: 06:30 UTC (Mon-Fri)
    - cron: '30 6 * * 1-5'
    
    # 🇺🇸 New York Session Open: 12:30 UTC (Mon-Fri)
    - cron: '30 12 * * 1-5'
    
    # 🌆 End of Day (EOD) Summary: 21:00 UTC (Mon-Fri)
    - cron: '0 21 * * 1-5'

  # Manual Trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Session Mode to Run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - london
          - ny
          - eod
          - update

jobs:
  run-macro-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance matplotlib google-genai requests

      - name: Run Apex Macro Engine (Scheduled)
        if: github.event_name == 'schedule'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          # Detect scheduled time and set session mode
          HOUR=$(date -u +%H)
          if [ "$HOUR" -eq "06" ] || [ "$HOUR" -eq "07" ]; then
            python main.py --mode london
          elif [ "$HOUR" -eq "12" ] || [ "$HOUR" -eq "13" ]; then
            python main.py --mode ny
          else
            python main.py --mode eod
          fi

      - name: Run Apex Macro Engine (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python main.py --mode ${{ github.event.inputs.mode }}
