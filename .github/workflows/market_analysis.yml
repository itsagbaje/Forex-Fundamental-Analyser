name: Apex Macro Desk Intelligence Pipeline

on:
  # 1. Primary Trigger: Webhook from cron-job.org
  repository_dispatch:
    types: [run_apex_desk]

  # 2. Manual Trigger: GitHub Console
  workflow_dispatch:
    inputs:
      session_mode:
        description: 'Select Session Mode'
        required: true
        default: 'LONDON'
        type: choice
        options:
          - ASIA
          - LONDON
          - NY
          - INTRADAY
          - EOD

  # 3. Backup Schedule Map (GitHub Actions requires UTC / Lagos UTC+1)
  schedule:
    - cron: '30 22 * * 0-4' # Asia (11:30 PM WAT / 22:30 UTC)
    - cron: '30 6 * * 1-5'  # London (7:30 AM WAT / 06:30 UTC)
    - cron: '30 11 * * 1-5' # New York (12:30 PM WAT / 11:30 UTC)
    - cron: '0 21 * * 1-5'  # EOD (10:00 PM WAT / 21:00 UTC)

jobs:
  run-macro-desk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance python-dotenv matplotlib requests google-genai

      - name: Determine Active Session Mode
        id: session_check
        run: |
          SELECTED_MODE="LONDON"

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            INPUT_MODE="${{ github.event.client_payload.session_mode }}"
            if [ -n "$INPUT_MODE" ]; then
              SELECTED_MODE="$INPUT_MODE"
            fi
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_MODE="${{ github.event.inputs.session_mode }}"
          else
            # Backup UTC hour check matching 22:30, 05:30, 11:30, and 21:00 UTC
            HOUR=$(date -u +%H)
            if [ "$HOUR" -eq "22" ]; then SELECTED_MODE="ASIA";
            elif [ "$HOUR" -eq "6" ]; then SELECTED_MODE="LONDON";
            elif [ "$HOUR" -eq "11" ]; then SELECTED_MODE="NY";
            elif [ "$HOUR" -eq "21" ]; then SELECTED_MODE="EOD";
            fi
          fi

          echo "MODE=$SELECTED_MODE" >> $GITHUB_ENV
          echo "Active Execution Mode: $SELECTED_MODE"

      - name: Execute Apex Macro Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python main.py --mode ${{ env.MODE }}

      - name: Commit Updated CSV Setup Logs
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add setups_log.csv || true
          git commit -m "Auto-update trade setups log [skip ci]" || true
          git push || true
          
