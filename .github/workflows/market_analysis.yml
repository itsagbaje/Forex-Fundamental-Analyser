name: Automated Forex Fundamental Analysis

on:
  # Listens for real-time external API pings
  repository_dispatch:
    types: [trigger-market-analysis]

  # Allows manual runs from the GitHub UI for testing
  workflow_dispatch:
    inputs:
      mode:
        description: 'Session Analysis Mode'
        required: true
        default: 'INTRADAY_UPDATE'
        type: choice
        options:
          - LONDON
          - NEW_YORK
          - INTRADAY_UPDATE
          - EOD
      custom_feed:
        description: 'Breaking Event Data / Live News Override (Optional)'
        required: false
        type: string

jobs:
  analyze-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests python-dotenv yfinance matplotlib

      - name: Determine Analysis Mode
        id: select_mode
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.client_payload.mode }}" >> $GITHUB_ENV
            echo "CUSTOM_FEED=${{ github.event.client_payload.custom_feed }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "RUN_MODE=${{ github.event.inputs.mode }}" >> $GITHUB_ENV
            echo "CUSTOM_FEED=${{ github.event.inputs.custom_feed }}" >> $GITHUB_ENV
          fi

      - name: Execute Fundamental Analyser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          GEMINI_MODEL: "gemini-3.5-flash"
        run: |
          if [ -n "$CUSTOM_FEED" ]; then
            python main.py --mode ${{ env.RUN_MODE }} --feed "$CUSTOM_FEED"
          else
            python main.py --mode ${{ env.RUN_MODE }}
          fi
